# Local dev backing services. The apps themselves run on the host via
# `pnpm dev` — only stateful services live in Docker.
#
#   docker compose up -d mongo            # MongoDB (default)
#   docker compose --profile queue up -d  # + Redis (needed from Phase 6)
#   docker compose down                   # stop (keeps data volumes)
#   docker compose down -v                # stop + wipe data
#
# Mongo runs as a single-node replica set (rs0) so multi-document
# transactions work — Phase 1 creates user + workspace + membership atomically.

services:
  mongo:
    image: mongo:8
    container_name: lyra-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiate the replica set on first boot (advertise localhost so the
      # host-side driver can reach the primary); report ok thereafter.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: lyra-redis
    restart: unless-stopped
    profiles: ["queue"] # only starts with `--profile queue` (Phase 6+)
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── Built-in connectors (opt-in): `docker compose --profile connectors up -d` ──
  # The connector logic lives in a separate microservice. DOWNLOAD is powered by
  # yt-dlp (public-domain, 1,000+ sites) BUNDLED INSIDE connectors-service — not a
  # separate container. PUBLISH calls self-hosted Postiz (AGPL, its own HTTP API).
  # Lyra's api just proxies to the microservice (set CONNECTORS_SERVICE_URL in
  # apps/api/.env). Unset = the api serves mock data and none of this is needed.

  # Cobalt — OPTIONAL download fallback (only for sites yt-dlp can't handle). The
  # primary engine is yt-dlp, inside connectors-service. Omit this unless you want a
  # fallback. AGPL → runs unmodified behind its HTTP API.
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: lyra-cobalt
    restart: unless-stopped
    profiles: ["connectors"]
    ports:
      - "9000:9000"
    environment:
      API_URL: "http://localhost:9000/"

  # Postiz — multi-channel publish backend. TEMPLATE — verify against the official
  # quickstart (https://docs.postiz.com) before production; it needs its own
  # Postgres + Redis and several env vars (MAIN_URL/NEXT_PUBLIC_BACKEND_URL/
  # DATABASE_URL/REDIS_URL/JWT_SECRET). Self-host also requires registering each
  # platform's developer app + app review (Postiz provides the OAuth flows, not the
  # approvals).
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: lyra-postiz
    restart: unless-stopped
    profiles: ["connectors"]
    ports:
      - "5000:5000"
    environment:
      MAIN_URL: "http://localhost:5000"
      FRONTEND_URL: "http://localhost:5000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:5000/api"
      JWT_SECRET: "change-me-postiz-jwt"
      DATABASE_URL: "postgresql://postiz:postiz@postiz-postgres:5432/postiz"
      REDIS_URL: "redis://postiz-redis:6379"
    depends_on:
      - postiz-postgres
      - postiz-redis

  postiz-postgres:
    image: postgres:17-alpine
    container_name: lyra-postiz-postgres
    restart: unless-stopped
    profiles: ["connectors"]
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: postiz
      POSTGRES_DB: postiz
    volumes:
      - postiz_pg_data:/var/lib/postgresql/data

  postiz-redis:
    image: redis:7-alpine
    container_name: lyra-postiz-redis
    restart: unless-stopped
    profiles: ["connectors"]
    volumes:
      - postiz_redis_data:/data

  # Connectors microservice — PLACEHOLDER for your separate track. It exposes the
  # contract Lyra's proxy forwards to (channels/publish/jobs/resolve/download).
  # Its image must BUNDLE yt-dlp + ffmpeg (the download engine); it calls Postiz for
  # publish, and Cobalt only as an optional fallback. Point `build` at its source
  # (or set `image`) when it exists.
  connectors-service:
    profiles: ["connectors"]
    build:
      context: .
      dockerfile: apps/connectors-service/Dockerfile
    container_name: lyra-connectors-service
    restart: unless-stopped
    ports:
      - "9100:9100"
    environment:
      PORT: "9100"
      CONNECTORS_SERVICE_TOKEN: "change-me-shared-token"
      FILE_TTL_MS: "900000"
      JOB_TTL_MS: "900000"
      POSTIZ_API_URL: "http://postiz:5000"
      POSTIZ_PUBLIC_URL: "http://localhost:5000"
    depends_on:
      - postiz

volumes:
  mongo_data:
  redis_data:
  postiz_pg_data:
  postiz_redis_data:
