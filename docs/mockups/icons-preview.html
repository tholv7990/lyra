  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; margin-top: 18px; }
  .cell { background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }

  .row svg { color: #1d1d1f; }
  .big { width: 28px; height: 28px; }
  .lbl { font-size: 12px; color: rgba(60,60,67,.62); }
  .dark { background: #1d1d23; }
  .dark .cell { background: #26262e; border-color: rgba(255,255,255,.1); }
  .dark .row svg, .dark .lbl { color: #e6e6ea; }
</style>
